name: Backup helper tests

on:
  push:
    paths:
      - 'scripts/backup_*.py'
      - 'Tests/BackupRecoveryTests/**'
      - 'requirements-encrypted.txt'
      - '.github/workflows/backup-helper.yml'
  pull_request:
    paths:
      - 'scripts/backup_*.py'
      - 'Tests/BackupRecoveryTests/**'
      - 'requirements-encrypted.txt'
      - '.github/workflows/backup-helper.yml'

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-encrypted.txt ruff==0.17.5
      - run: python -m ruff check Tests/BackupRecoveryTests scripts/backup_common.py scripts/backup_preflight.py scripts/backup_recovery.py scripts/backup_wizard.py
      - run: python -m ruff format --check Tests/BackupRecoveryTests scripts/backup_common.py scripts/backup_preflight.py scripts/backup_recovery.py scripts/backup_wizard.py
      - run: python -m compileall -q Tests/BackupRecoveryTests scripts/backup_common.py scripts/backup_preflight.py scripts/backup_recovery.py scripts/backup_wizard.py
      - run: python -m unittest discover -s Tests/BackupRecoveryTests -p "test_*.py" -v
